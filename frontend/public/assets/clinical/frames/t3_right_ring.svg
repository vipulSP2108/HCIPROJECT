<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" style="background:#f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Subtle Clinical Grid -->
    <pattern id="medGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e2e8f0" stroke-width="0.8" opacity="0.85"/>
    </pattern>
    <!-- Radial Glow for Precision Targets -->
    <radialGradient id="targetGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <!-- Motion Arrowheads -->
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0284c7"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#10b981"/>
    </marker>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background Canvas & Grid -->
  <rect width="800" height="600" fill="#f8fafc"/>
  <rect width="800" height="600" fill="url(#medGrid)"/>

  <!-- Header Action Badge & Titles -->
  <g transform="translate(400, 38)" text-anchor="middle">
    <rect x="-160" y="-18" width="320" height="32" rx="16" fill="#ffffff" stroke="#10b981" stroke-width="1.6" filter="url(#cardShadow)"/>
    <circle cx="-135" cy="-2" r="4.5" fill="#10b981"/>
    <text x="-120" y="2" font-size="11" font-weight="800" fill="#047857" letter-spacing="1.2" text-anchor="start">ACTION 4 OF 5 • RING PINCH (RIGHT HAND)</text>
    
    <text x="0" y="38" font-size="20" font-weight="900" fill="#0f172a">Thumb to Ring Precision Tip-to-Tip Pinch</text>
    <text x='0' y=58 font-size='12' font-weight='600' fill='#64748b'>Complete the sequence: touch thumb tip cleanly to RING fingertip.</text>
  </g><g transform="translate(400, 110)">
      <rect x="-220" y="-16" width="80" height="34" rx="8" fill="#10b981" stroke="#10b981" stroke-width="1.6"/>
      <text x="-180" y="-2" font-size="10.5" font-weight="800" fill="#ffffff" text-anchor="middle">Thumb</text>
      <text x="-180" y="11" font-size="8.5" font-weight="700" fill="#d1fae5" text-anchor="middle">Digit I</text>
      <rect x="-130" y="-16" width="80" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.6"/>
      <text x="-90" y="-2" font-size="10.5" font-weight="800" fill="#334155" text-anchor="middle">Index</text>
      <text x="-90" y="11" font-size="8.5" font-weight="700" fill="#94a3b8" text-anchor="middle">Digit II</text>
      <rect x="-40" y="-16" width="80" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.6"/>
      <text x="0" y="-2" font-size="10.5" font-weight="800" fill="#334155" text-anchor="middle">Middle</text>
      <text x="0" y="11" font-size="8.5" font-weight="700" fill="#94a3b8" text-anchor="middle">Digit III</text>
      <rect x="50" y="-16" width="80" height="34" rx="8" fill="#10b981" stroke="#10b981" stroke-width="1.6"/>
      <text x="90" y="-2" font-size="10.5" font-weight="800" fill="#ffffff" text-anchor="middle">Ring</text>
      <text x="90" y="11" font-size="8.5" font-weight="700" fill="#d1fae5" text-anchor="middle">Digit IV</text>
      <rect x="140" y="-16" width="80" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.6"/>
      <text x="180" y="-2" font-size="10.5" font-weight="800" fill="#334155" text-anchor="middle">Pinky</text>
      <text x="180" y="11" font-size="8.5" font-weight="700" fill="#94a3b8" text-anchor="middle">Digit V</text></g>
  <!-- Palm Base & Wrist -->
  <rect x="360" y="420" width="80" height="85" rx="18" fill="#f1f5f9" stroke="#334155" stroke-width="4.5"/>
  <line x1="400" y1="505" x2="400" y2="545" stroke="#334155" stroke-width="6" stroke-linecap="round"/>

  <!-- Digit I: Thumb (Curving to Contact Point) -->
  <path d="M 360 440 L 310 380 L 360 290" fill="none" stroke="#10b981" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="310" cy="380" r="5" fill="#3b82f6"/>
  <circle cx="360" cy="290" r="6.5" fill="#10b981"/>

  <!-- Relaxed Digit: Index -->
  <path d="M 375 420 L 367.5 310.0 L 360 200" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="367.5" cy="310.0" r="4" fill="#cbd5e1"/>
  <circle cx="360" cy="200" r="5" fill="#94a3b8"/>

  <!-- Relaxed Digit: Middle -->
  <path d="M 395 420 L 397.5 302.5 L 400 185" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="397.5" cy="302.5" r="4" fill="#cbd5e1"/>
  <circle cx="400" cy="185" r="5" fill="#94a3b8"/>

  <!-- Opposing Digit: Ring -->
  <path d="M 415 420 L 425 355.0 L 360 290" fill="none" stroke="#10b981" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="425" cy="355.0" r="5" fill="#3b82f6"/>

  <!-- Relaxed Digit: Pinky -->
  <path d="M 435 420 L 455.0 327.5 L 475 235" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="455.0" cy="327.5" r="4" fill="#cbd5e1"/>
  <circle cx="475" cy="235" r="5" fill="#94a3b8"/>
  <!-- Precision Target Crosshair -->
  <g transform="translate(360, 290)">
    <circle r="26" fill="url(#targetGlow)"/>
    <circle r="16" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="3 3"/>
    <circle r="6" fill="#10b981" stroke="#ffffff" stroke-width="1.8"/>
    <line x1="-22" y1="0" x2="-8" y2="0" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
    <line x1="8" y1="0" x2="22" y2="0" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="-22" x2="0" y2="-8" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="8" x2="0" y2="22" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
  </g>  <!-- Target Callout Card -->
  <g transform="translate(400, 264)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="180" height="52" rx="12" fill="#ffffff" stroke="#10b981" stroke-width="1.8"/>
    <circle cx="22" cy="26" r="10" fill="#ecfdf5"/>
    <path d="M 17 26 L 21 30 L 28 22" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="40" y="22" font-size="10.5" font-weight="800" fill="#047857" letter-spacing="0.5">PRECISION PINCH POINT</text>
    <text x="40" y="38" font-size="10" font-weight="600" fill="#475569">Thumb + Ring Tip</text>
  </g>  <!-- Clinical Protocol Footer Bar -->
  <g transform="translate(400, 560)" text-anchor="middle">
    <rect x="-350" y="-18" width="700" height="36" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" filter="url(#cardShadow)"/>
    <circle cx="-328" cy="0" r="5" fill="#10b981"/>
    <text x="-312" y="4" font-size="11.5" font-weight="700" fill="#334155" text-anchor="start">Target: Touch Thumb Tip cleanly to Ring Tip • Hold 0.6s</text>
    <text x='325' y='4' font-size='11' font-weight='700' fill='#0284c7' text-anchor='end'>Right Hand • MediaPipe #16 ➔ #4</text>
  </g>
</svg>